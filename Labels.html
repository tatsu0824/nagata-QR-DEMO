<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  @page { size: A4 portrait; margin: 6mm; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f6f7f5; font-family: "Yu Gothic", "Meiryo", "Hiragino Sans", sans-serif; color: #111; }
  .bar { background: #2f6b3a; color: #fff; padding: 10px 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; }
  .bar a, .bar button { color: #fff; font-size: 14px; }
  .bar button { background: #fff; color: #2f6b3a; border: none; border-radius: 8px; padding: 6px 14px; font-weight: bold; cursor: pointer; font-family: inherit; }
  .page { width: 198mm; margin: 12px auto; }
  .plan { background: #fff; border: 1px dashed #bbb; padding: 3mm; margin-bottom: 3mm; break-inside: avoid; }
  .plan h2 { font-size: 9.5pt; margin: 0 0 2mm; color: #2f6b3a; }
  .row { display: flex; gap: 4mm; align-items: flex-start; }
  .cap { font-size: 8pt; color: #666; margin-top: 1mm; text-align: center; }
  .qr svg { display: block; width: 100%; height: 100%; }
  .qrid { font-family: monospace; font-size: 6.5pt; text-align: center; }

  /* 播種シール（細長いシール） */
  .seed { width: 82mm; height: 19mm; border: .3mm solid #999; border-radius: 1.5mm; display: flex; align-items: center; padding: 1mm 1.5mm 1mm 3mm; gap: 2mm; }
  .seed .date { font-size: 12pt; font-weight: bold; white-space: nowrap; letter-spacing: .02em; }
  .seed .mid { flex: 1; min-width: 0; }
  .seed .nm { font-size: 9.5pt; font-weight: bold; white-space: nowrap; overflow: hidden; }
  .seed .to { font-size: 8.5pt; text-align: right; font-weight: bold; }
  .seed .bt { display: flex; justify-content: space-between; align-items: center; font-size: 8pt; margin-top: .5mm; }
  .seed .color { background: #ccc; padding: 0 3mm; min-width: 16mm; text-align: center; }
  .seed .qr { width: 15mm; height: 15mm; flex: none; }

  /* 土カード（土入りポット配置カード） */
  .soil { width: 52mm; border: .3mm solid #999; padding: 2.5mm; background: #fff; }
  .soil .hd { text-align: center; font-size: 7.5pt; line-height: 1.5; margin-bottom: 1.5mm; }
  .soil table { width: 100%; border-collapse: collapse; }
  .soil td { border: .3mm solid #333; text-align: center; font-size: 9pt; padding: 1.2mm .5mm; }
  .soil td.big { font-size: 10pt; }
  .soil .qr { width: 22mm; height: 22mm; margin: 2.5mm auto 0; }

  /* 鉢上げラベル（ラベルに貼るシール） */
  .pot { width: 40mm; border: .3mm solid #999; background: #fbf7f7; }
  .pot table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .pot td { border-bottom: .2mm dashed #888; font-size: 7pt; text-align: center; padding: .4mm .3mm; height: 4.2mm; }
  .pot td + td { border-left: .2mm solid #888; }
  .pot td.v { font-size: 9pt; }
  .pot td.red { color: #c00; font-size: 9pt; }
  .pot td.wide { font-size: 9pt; }
  .pot .qrcell { padding: .6mm; }
  .pot .qr { width: 14mm; height: 14mm; margin: 0 auto; }

  @media print {
    body { background: #fff; }
    .bar, .noprint { display: none; }
    .page { margin: 0; width: auto; }
  }
</style>
</head>
<body>
<div class="bar noprint">
  <div><b>ラベル印刷</b>　播種シール・土カード・鉢上げラベル（各計画に同じQR）</div>
  <div><a id="back" href="#">一覧へ</a>　<button onclick="window.print()">印刷する</button></div>
</div>
<div class="page" id="page"></div>

<script>
const BOOT = <?!= boot ?>;
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function planUrl(id) { return BOOT.url ? BOOT.url + '?id=' + encodeURIComponent(id) : '?id=' + encodeURIComponent(id); }
function qrSvg(text) {
  const qr = qrcode(0, 'M'); qr.addData(text); qr.make();
  return qr.createSvgTag({ cellSize: 2, margin: 0, scalable: true });
}
document.getElementById('back').href = BOOT.url || '?';

document.getElementById('page').innerHTML = BOOT.state.plans.map(p => {
  const v = p.v, w = p.w, qr = qrSvg(planUrl(p.id));
  const name = esc(v['品番'] + ' ' + v['品目'] + ' ' + v['品種']);
  return `<div class="plan">
    <h2>${esc(p.id)}　${name}</h2>
    <div class="row">
      <div>
        <div class="seed">
          <div class="date">${esc(v['播種予定日'])}－ ${esc(v['鉢上予定日'])}</div>
          <div class="mid">
            <div class="nm">${name}</div>
            <div class="to">${esc(v['出荷先'])}</div>
            <div class="bt"><span>ﾌﾟﾗｸﾞ${esc(v['播種トレイ'])}</span><span class="color">${esc(v['P色'])}</span></div>
          </div>
          <div><div class="qr">${qr}</div></div>
        </div>
        <div class="cap">① 播種シール（プラグトレイに貼る）</div>
      </div>
      <div>
        <div class="soil">
          <div class="hd">2026年 春野菜苗計画<br>土入りポット 配置カード</div>
          <table>
            <tr><td class="big">${esc(w['ポット使用日'] || v['ポット使用日'])}</td><td class="big">${esc(v['ポット使用TR数'])}</td></tr>
            <tr><td colspan="2">${name}</td></tr>
            <tr><td>${esc(v['Pサイズ'])}</td><td>${esc(v['P色'])}</td></tr>
          </table>
          <div class="qr">${qr}</div>
          <div class="qrid">${esc(p.id)}</div>
        </div>
        <div class="cap">② 土カード</div>
      </div>
      <div>
        <div class="pot">
          <table>
            <tr><td class="v">${esc(v['品目'])}</td><td class="v">${esc(v['品種'])}</td></tr>
            <tr><td>${esc(v['Pサイズ'])}</td><td>${esc(v['P色'])}</td></tr>
            <tr><td colspan="2" class="wide">${esc(v['播種予定日'])} － ${esc(v['鉢上予定日'])}</td></tr>
            <tr><td></td><td>${esc(v['出荷先'])}</td></tr>
            <tr><td>出荷予定日</td><td>出荷TR数</td></tr>
            <tr><td class="red">${esc(v['出荷日'])}</td><td class="v">${esc(v['出荷TR数'])}</td></tr>
            <tr><td>鉢上予定</td><td>TR数</td></tr>
            <tr><td class="v">${esc(v['鉢上予定日'])}</td><td class="v">${esc(v['鉢上予定TR数'])}</td></tr>
            <tr><td>鉢上日</td><td>TR数</td></tr>
            <tr><td></td><td></td></tr>
            <tr><td>過不足数</td><td class="qrcell"><div class="qr">${qr}</div></td></tr>
          </table>
        </div>
        <div class="cap">③ 鉢上げラベル</div>
      </div>
    </div>
  </div>`;
}).join('');
</script>
</body>
</html>
